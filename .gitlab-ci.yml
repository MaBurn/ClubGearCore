workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - maintenance
  - security
  - security-report
  - validate
  - build
  - test
  - image
  - deploy

default:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  interruptible: true
  cache:
    key: "nuget-$CI_PROJECT_ID"
    paths:
      - .nuget/packages/

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "1"
  GIT_SUBMODULE_FORCE_HTTPS: "true"

renovate:
  stage: maintenance
  image:
    name: renovate/renovate:44.39.1
    entrypoint: [""]
  variables:
    RENOVATE_PLATFORM: "gitlab"
    RENOVATE_ENDPOINT: "$CI_SERVER_URL/api/v4"
    RENOVATE_AUTODISCOVER: "true"
    RENOVATE_AUTODISCOVER_FILTER: "clubgear/*"
    RENOVATE_CONFIG_FILE: "$CI_PROJECT_DIR/renovate.json"
  script:
    - test -n "$RENOVATE_TOKEN"
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_ENABLED == "true"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  script:
    - gitleaks git --redact --verbose --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - gitleaks-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

dependency-audit:
  stage: security
  script:
    # %3B escapes the semicolon: MSBuild treats a bare `;` inside -p: as a separator
    # between properties, so NU1904 would be parsed as its own malformed property.
    - dotnet restore tests/ClubGear.ArchitectureTests/ClubGear.ArchitectureTests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all "-p:WarningsAsErrors=NU1903%3BNU1904"
    - dotnet list tests/ClubGear.ArchitectureTests/ClubGear.ArchitectureTests.csproj package --vulnerable --include-transitive > dependency-audit.txt
    - cat dependency-audit.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dependency-audit.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

dependency-scan-full:
  stage: security
  image:
    name: ghcr.io/owasp-dep-scan/dep-scan:v6.3.0
    entrypoint: [""]
  variables:
    VDB_HOME: "$CI_PROJECT_DIR/.depscan"
    VDB_APP_ONLY: "true"
  cache:
    key: "depscan-vdb"
    paths:
      - .depscan/
  script:
    - mkdir -p depscan-reports
    - depscan --src "$CI_PROJECT_DIR" --reports-dir "$CI_PROJECT_DIR/depscan-reports" -t dotnet --profile appsec --no-universal
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - depscan-reports/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DEPSCAN_ENABLED != "false"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

dependency-report-pdf:
  stage: security-report
  image: alpine:3.22
  needs:
    - job: dependency-scan-full
      artifacts: true
  script:
    - apk add --no-cache chromium
    - REPORT_HTML="$(find depscan-reports -type f -name '*.html' -print -quit)"
    - test -n "$REPORT_HTML"
    - chromium --headless --no-sandbox --disable-gpu --print-to-pdf=clubgear-dependency-report.pdf "file://$CI_PROJECT_DIR/$REPORT_HTML"
  artifacts:
    expire_in: 30 days
    paths:
      - clubgear-dependency-report.pdf
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DEPSCAN_ENABLED != "false"
    - if: $CI_PIPELINE_SOURCE == "web"

submodules:
  stage: validate
  script:
    - git submodule status --recursive
    - test -f plugins/CarInfo/CarInfo.Plugin.csproj
    - test -f plugins/Finance/Finance.Plugin.csproj
    - test -f plugins/IamOidc/IamOidc.Plugin.csproj
    - test -f plugins/Inventar/Inventar.Plugin.csproj
    - test -f plugins/ServiceBook/ServiceBook.Plugin.csproj
    - |
      # CORE-23. Mirrors PluginBoundaryTests.NormalizeRemoteUrl and
      # FindSubmoduleHygieneViolations (tests/ClubGear.ArchitectureTests/PluginBoundaryTests.cs),
      # the architecture tests that are the primary defence because they run on the developer
      # machine where the defect actually originates. Both implementations are pinned to the same
      # tests/ClubGear.ArchitectureTests/Fixtures/submodule-url-normalization.cases.tsv rows, so
      # neither can drift from the rule, or from the other, without a red build.
      #
      # Caveat: GIT_SUBMODULE_STRATEGY: recursive (above) means GitLab clones every submodule
      # straight from .gitmodules, so in a fresh CI clone this step is structurally incapable of
      # failing -- every gitlink is already proper and every effective URL is already a rewrite of
      # the declared one. It still ships for parity with this job's established
      # shell-assertion/architecture-test pairing, and for the non-fresh runner (a cached
      # GIT_STRATEGY: fetch, a pre-seeded runner cache) that could otherwise carry a stale
      # .git/config.
      normalize() {
        value=$1
        value=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        value=${value%/}
        case "$value" in
          *.git) value=${value%.git} ;;
        esac
        had_scheme=0
        case "$value" in
          *://*) had_scheme=1; value=${value#*://} ;;
        esac
        case "$value" in
          */*) segment=${value%%/*}; remainder=/${value#*/} ;;
          *) segment=$value; remainder="" ;;
        esac
        case "$segment" in
          *@*) segment=${segment##*@} ;;
        esac
        # Only rewrite the scp-style 'host:path' separator when no '://' scheme was present --
        # with a scheme the colon is an explicit port, a real difference (see the 'ssh://...:22/...'
        # fixture row, which is documented as NOT equal to the bare form).
        if [ "$had_scheme" -eq 0 ]; then
          case "$segment" in
            *:*) segment="${segment%%:*}/${segment#*:}" ;;
          esac
        fi
        value="${segment}${remainder}"
        value=$(printf '%s' "$value" | sed 's#/\{2,\}#/#g')
        value=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
        printf '%s' "$value"
      }

      # Self-test against the shared fixture, before any real submodule is inspected.
      fixture="tests/ClubGear.ArchitectureTests/Fixtures/submodule-url-normalization.cases.tsv"
      test -f "$fixture"
      row=0
      while IFS="$(printf '\t')" read -r raw expected || [ -n "$raw" ]; do
        case "$raw" in
          ''|'#'*) continue ;;
        esac
        row=$((row + 1))
        got=$(normalize "$raw")
        if [ "$got" != "$expected" ]; then
          echo "normalize() self-test failed on fixture row $row: raw='$raw' expected='$expected' got='$got'" >&2
          exit 1
        fi
      done < "$fixture"
      echo "normalize() self-test passed: $row fixture rows agree with PluginBoundaryTests.NormalizeRemoteUrl."

      # Per-module checks: plugins/<X>/.git must be a gitlink file, and the effective URL in
      # .git/config must normalise equal to the plugins/<X> declaration in .gitmodules. Reads both
      # config files directly -- no shelling out to git for the URLs -- which is what lets this
      # step and PluginBoundaryTests.FindSubmoduleHygieneViolations see literally the same input.
      for module in CarInfo Finance IamOidc Inventar ServiceBook; do
        entry="plugins/$module/.git"

        if [ -d "$entry" ]; then
          echo "plugins/$module: embedded repository -- $entry is a directory, expected a gitlink file. Remedy: verify nothing is unpushed, then git submodule deinit -f plugins/$module, remove plugins/$module/.git, then git submodule update --init plugins/$module." >&2
          exit 1
        fi

        declared=$(sed -n "/\[submodule \"plugins\/$module\"\]/,/^\[/p" .gitmodules | grep -m1 '^[[:space:]]*url[[:space:]]*=' | sed 's/^[[:space:]]*url[[:space:]]*=[[:space:]]*//')

        if [ -z "$declared" ]; then
          echo "plugins/$module: not declared in .gitmodules." >&2
          exit 1
        fi

        effective=$(sed -n "/\[submodule \"plugins\/$module\"\]/,/^\[/p" .git/config | grep -m1 '^[[:space:]]*url[[:space:]]*=' | sed 's/^[[:space:]]*url[[:space:]]*=[[:space:]]*//')

        if [ -z "$effective" ]; then
          # Not initialised in .git/config: the earlier `test -f .../*.csproj` lines above already
          # fail a fresh clone that never ran `git submodule update --init --recursive`.
          continue
        fi

        if [ "$(normalize "$declared")" != "$(normalize "$effective")" ]; then
          echo "plugins/$module: effective URL '$effective' does not resolve to the declared '$declared'. Remedy: git submodule sync --recursive." >&2
          exit 1
        fi
      done
      echo "submodule hygiene: all plugin gitlinks and effective URLs agree with .gitmodules."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

build:
  stage: build
  script:
    - dotnet restore ClubGear.csproj
    - dotnet build ClubGear.csproj -c Release --no-restore /warnaserror
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - bin/Release/
      - Contracts/Plugin/bin/Release/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

package-plugins:
  stage: build
  before_script:
    # package-plugin.sh zips the payload; the .NET SDK image has no zip.
    - apt-get update -qq && apt-get install -y --no-install-recommends zip
  script:
    - |
      install_key() {
        plugin="$1"; keyfile="$2"
        if [ -z "$keyfile" ] || [ ! -s "$keyfile" ]; then
          echo "No signing key supplied for $plugin." >&2
          echo "Define a file-type CI variable holding dist/signer-private.pem for it." >&2
          echo "Refusing to package without it: package-plugin.sh would mint a fresh key and" >&2
          echo "overwrite the published dist/signer-public.pem, breaking every installation" >&2
          echo "that pinned the old one." >&2
          exit 1
        fi
        mkdir -p "plugins/$plugin/.signing"
        cp "$keyfile" "plugins/$plugin/.signing/signer-private.pem"
        chmod 600 "plugins/$plugin/.signing/signer-private.pem"
      }
      install_key CarInfo "${CARINFO_SIGNING_KEY:-}"
      install_key ServiceBook "${SERVICEBOOK_SIGNING_KEY:-}"
      install_key Finance "${FINANCE_SIGNING_KEY:-}"
    - scripts/package-plugin.sh plugins/CarInfo
    - scripts/package-plugin.sh plugins/ServiceBook
    - scripts/package-plugin.sh plugins/Finance
  after_script:
    - rm -f plugins/CarInfo/.signing/signer-private.pem plugins/ServiceBook/.signing/signer-private.pem plugins/Finance/.signing/signer-private.pem
  artifacts:
    expire_in: 7 days
    paths:
      - plugins/CarInfo/dist/
      - plugins/ServiceBook/dist/
      - plugins/Finance/dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

test:
  stage: test
  before_script:
    # The .NET SDK image ships no Node. Without it
    # MemberIndexGroupFilterTests.GroupAwareFilter_BehaviorScenarios_PassUnderNode returns
    # early and reports as passed, so the filter behaviour scenarios were never actually
    # exercised in CI. Debian's nodejs package provides /usr/bin/node, one of the paths the
    # test probes.
    - apt-get update -qq && apt-get install -y --no-install-recommends nodejs
    - node --version
  script:
    - dotnet restore tests/ClubGear.ArchitectureTests/ClubGear.ArchitectureTests.csproj
    - dotnet test tests/ClubGear.ArchitectureTests/ClubGear.ArchitectureTests.csproj -c Release --no-restore --logger "junit;LogFilePath=$CI_PROJECT_DIR/TestResults/core-tests.xml;MethodFormat=Class;FailureBodyFormat=Verbose" --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - TestResults/
    reports:
      junit: TestResults/core-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: TestResults/**/coverage.cobertura.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

container:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

container-scan:
  stage: image
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - container
  variables:
    GIT_STRATEGY: none
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format table --output container-scan.txt "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output container-scan.sarif "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - trivy image --format cyclonedx --output gl-sbom-clubgear.cdx.json "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - cat container-scan.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - container-scan.txt
      - container-scan.sarif
      - gl-sbom-clubgear.cdx.json
  rules:
    # Must mirror the schedule guard of the `container` job it needs: a scheduled
    # pipeline on the default branch would otherwise pull this job in without its
    # dependency and fail pipeline creation outright.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-podman-production:
  stage: deploy
  tags:
    - podman-production
  # Overrides the global default: auto-cancelling a redundant pipeline must never
  # abort a running deployment between `podman run --replace` and a healthy container.
  interruptible: false
  variables:
    GIT_STRATEGY: none
    PODMAN_CONTAINER_NAME: clubgear
    PODMAN_ENV_FILE: /etc/clubgear/clubgear.env
    PODMAN_DATA_DIR: /var/lib/clubgear
    PODMAN_HTTP_PORT: "5080"
  resource_group: production
  environment:
    name: production
  before_script:
    - test -r "$PODMAN_ENV_FILE"
    - test -d "$PODMAN_DATA_DIR"
    - echo "$CI_REGISTRY_PASSWORD" | podman login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - podman pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - podman run --detach --replace --name "$PODMAN_CONTAINER_NAME" --restart=always --env-file "$PODMAN_ENV_FILE" --publish "$PODMAN_HTTP_PORT:8080" --volume "$PODMAN_DATA_DIR:/data:Z" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - podman image prune --force
  after_script:
    - podman logout "$CI_REGISTRY" || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
