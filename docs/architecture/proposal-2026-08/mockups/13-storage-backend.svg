<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="860" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#0077BA"/><text x="28" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start">ClubGear</text><text x="197.0" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="400" text-anchor="middle" opacity="0.85">Dashboard</text><text x="287.5" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="400" text-anchor="middle" opacity="0.85">Members</text><text x="389.5" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="400" text-anchor="middle" opacity="0.85">Organisation</text><text x="495.0" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="400" text-anchor="middle" opacity="0.85">Calendar</text><text x="581.5" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="400" text-anchor="middle" opacity="0.85">Plugins</text><rect x="625" y="14" width="64" height="28" rx="6" fill="rgba(255,255,255,0.18)"/><text x="657.0" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1">Admin</text><text x="1184" y="36" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#ffffff" font-weight="400" text-anchor="middle" opacity="0.9">✉</text><circle cx="1194" cy="20" r="9" fill="#EF7D00"/><text x="1194" y="24" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="1236" cy="28" r="15" fill="rgba(255,255,255,0.22)"/><text x="1236" y="33" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">MB</text><text x="28" y="88" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">CORE · CORE-02  ·  STORAGE BACKEND</text><text x="28" y="120" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="25" fill="#0077BA" font-weight="700" text-anchor="start">File storage</text><text x="28" y="144" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="start">Where the bytes live. Metadata, authorisation and audit stay in ClubGear whichever backend is selected.</text><rect x="1168" y="88" width="84" height="34" rx="6" fill="#0077BA" stroke="#0077BA" stroke-width="1"/><text x="1210.0" y="109.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Save</text><rect x="1014" y="88" width="144" height="34" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="1086.0" y="109.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#16354f" font-weight="600" text-anchor="middle">Test connection</text><rect x="28" y="170" width="620" height="320" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="46" y="200" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#0077BA" font-weight="600" text-anchor="start">Active backend</text><text x="46" y="222" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="start">One backend is authoritative for new uploads</text><line x1="28" y1="244" x2="648" y2="244" stroke="#e6e8eb" stroke-width="1"/><rect x="46" y="252" width="584" height="96" rx="10" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><circle cx="69" cy="277" r="7" fill="#fff" stroke="#d5dce2" stroke-width="1"/><text x="90" y="282" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#16354f" font-weight="700" text-anchor="start">Local filesystem</text><rect x="571" y="272" width="43" height="20" rx="10" fill="#e6f2f9"/><text x="592.5" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#005b99" font-weight="600" text-anchor="middle">core</text><text x="90" y="302" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">Ships with the core · no extra service</text><text x="90" y="326" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">· Fastest, no network dependency</text><text x="90" y="344" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">· Backup is a filesystem backup</text><rect x="46" y="360" width="584" height="120" rx="10" fill="rgba(0,119,186,0.05)" stroke="#0077BA" stroke-width="2"/><circle cx="69" cy="385" r="7" fill="#fff" stroke="#0077BA" stroke-width="2"/><circle cx="69" cy="385" r="3.5" fill="#0077BA"/><text x="90" y="390" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#16354f" font-weight="700" text-anchor="start">Nextcloud (WebDAV)</text><rect x="558" y="380" width="56" height="20" rx="10" fill="#efe6f7"/><text x="586.0" y="394" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">plugin</text><text x="90" y="410" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">Provided by clubgear.plugin.nextcloud-storage</text><text x="90" y="434" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">· Bytes live in your Nextcloud, visible to admins there</text><text x="90" y="452" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">· ClubGear still enforces every download authorisation</text><text x="90" y="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">· Requires a dedicated service account and app password</text><rect x="664" y="170" width="588" height="320" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="682" y="200" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#0077BA" font-weight="600" text-anchor="start">Nextcloud connection</text><text x="682" y="222" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="start">Credentials are encrypted at rest and redacted in logs</text><line x1="664" y1="244" x2="1252" y2="244" stroke="#e6e8eb" stroke-width="1"/><text x="682" y="258" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Base URL</text><rect x="682" y="266" width="380" height="36" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="693" y="288.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">https://cloud.musterverein.de</text><text x="1078" y="258" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Service user</text><rect x="1078" y="266" width="174" height="36" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="1089" y="288.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">clubgear-svc</text><text x="682" y="326" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">App password</text><rect x="682" y="334" width="380" height="36" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="693" y="356.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">••••••••••••••••••••</text><text x="1078" y="326" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Chunked upload</text><rect x="1078" y="334" width="174" height="36" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="1089" y="356.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">on</text><text x="1236" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="middle">⌄</text><text x="682" y="394" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Base path</text><rect x="682" y="402" width="570" height="36" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="693" y="424.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">/ClubGear/storage   (created and owned by ClubGear)</text><rect x="682" y="458" width="570" height="42" rx="8" fill="#e4f2ea"/><text x="698" y="484.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#187344" font-weight="400" text-anchor="start">✓</text><text x="720" y="484.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#187344" font-weight="400" text-anchor="start">Connected · Nextcloud 30.0.2 · 412 GB free · write test passed 09:41</text><rect x="28" y="506" width="760" height="268" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="46" y="536" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#0077BA" font-weight="600" text-anchor="start">Per-scope override</text><text x="46" y="558" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="start">Optional — a scope may deliberately stay local</text><line x1="28" y1="580" x2="788" y2="580" stroke="#e6e8eb" stroke-width="1"/><rect x="29" y="586" width="758" height="36" rx="0" fill="#f4f7fa"/><line x1="29" y1="622" x2="787" y2="622" stroke="#e6e8eb" stroke-width="1"/><text x="41" y="608.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="0.8">OWNER SCOPE</text><text x="271" y="608.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="0.8">BACKEND</text><text x="537" y="608.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="end" letter-spacing="0.8">OBJECTS</text><text x="561" y="608.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="0.8">REASON</text><text x="41" y="645.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="600" text-anchor="start">core.profile-image</text><rect x="271" y="631.0" width="75" height="20" rx="10" fill="#efe6f7"/><text x="308.5" y="645.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">Nextcloud</text><text x="537" y="645.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="end">1 284</text><text x="561" y="645.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="start">follows default</text><line x1="29" y1="660" x2="787" y2="660" stroke="#f0f2f4" stroke-width="1"/><rect x="29" y="660" width="758" height="38" rx="0" fill="#fbfcfd"/><text x="41" y="683.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="600" text-anchor="start">plugin.inventory</text><rect x="271" y="669.0" width="75" height="20" rx="10" fill="#efe6f7"/><text x="308.5" y="683.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">Nextcloud</text><text x="537" y="683.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="end">9 902</text><text x="561" y="683.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="start">follows default</text><line x1="29" y1="698" x2="787" y2="698" stroke="#f0f2f4" stroke-width="1"/><text x="41" y="721.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="600" text-anchor="start">plugin.documents</text><rect x="271" y="707.0" width="75" height="20" rx="10" fill="#efe6f7"/><text x="308.5" y="721.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">Nextcloud</text><text x="537" y="721.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="end">1 431</text><text x="561" y="721.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="start">follows default</text><line x1="29" y1="736" x2="787" y2="736" stroke="#f0f2f4" stroke-width="1"/><rect x="29" y="736" width="758" height="38" rx="0" fill="#fbfcfd"/><text x="41" y="759.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="600" text-anchor="start">plugin.finance</text><rect x="271" y="745.0" width="50" height="20" rx="10" fill="#e6f2f9"/><text x="296.0" y="759.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#005b99" font-weight="600" text-anchor="middle">Local</text><text x="537" y="759.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="end">230</text><text x="561" y="759.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="start">bank files stay on the host</text><line x1="29" y1="774" x2="787" y2="774" stroke="#f0f2f4" stroke-width="1"/><rect x="804" y="506" width="448" height="268" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="822" y="536" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#0077BA" font-weight="600" text-anchor="start">Migration local → Nextcloud</text><text x="822" y="558" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="start">Resumable, verified by checksum</text><line x1="804" y1="580" x2="1252" y2="580" stroke="#e6e8eb" stroke-width="1"/><rect x="822" y="606" width="412" height="8" rx="4.0" fill="#e9edf1"/><rect x="822" y="606" width="292.52" height="8" rx="4.0" fill="#0077BA"/><text x="822" y="636" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#16354f" font-weight="600" text-anchor="start">9 118 of 12 847 objects copied · 3.0 GB</text><text x="822" y="658" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">Every object records which backend holds it, so both</text><text x="822" y="676" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">are readable while the copy runs. Nothing is deleted</text><text x="822" y="694" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">from the source until its checksum is verified.</text><rect x="822" y="716" width="90" height="34" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="867.0" y="737.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#16354f" font-weight="600" text-anchor="middle">Pause</text><rect x="920" y="716" width="104" height="34" rx="6" fill="#ffffff" stroke="#d5dce2" stroke-width="1"/><text x="972.0" y="737.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#16354f" font-weight="600" text-anchor="middle">Verify all</text><rect x="28" y="790" width="1224" height="150" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="46" y="820" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#0077BA" font-weight="600" text-anchor="start">Failure policy</text><text x="46" y="842" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="start">Same rule as notification channels: never a silent substitution</text><line x1="28" y1="864" x2="1252" y2="864" stroke="#e6e8eb" stroke-width="1"/><text x="46" y="896" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9b2c2c" font-weight="700" text-anchor="start">Backend unreachable on upload</text><text x="360" y="896" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">The upload fails with a clear error. ClubGear does not quietly write the file to the local disk instead.</text><text x="46" y="928" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a5a00" font-weight="700" text-anchor="start">Backend unreachable on download</text><text x="360" y="928" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">503 with a retry hint. The metadata row stays valid; the object is not marked missing.</text><text x="46" y="960" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a5a00" font-weight="700" text-anchor="start">File removed inside Nextcloud</text><text x="360" y="960" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">Detected by a scheduled integrity check and reported as an orphaned reference, never auto-deleted.</text></svg>