ght="400" text-anchor="start">Jonas turns 18 on 04.11.2026 — Jugendmitglied rule expires.</text><text x="682" y="546" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#16354f" font-weight="700" text-anchor="start">Privacy</text><text x="682" y="570" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">Seeing a relationship does not grant access to</text><text x="682" y="589" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">another adult's profile. Access to a dependent</text><text x="682" y="608" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">requires an explicit policy plus identity link.</text><rect x="28" y="652" width="1224" height="190" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="46" y="682" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#0077BA" font-weight="600" text-anchor="start">What other modules see</text><text x="46" y="704" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="start">A minimal read model — never the member entity</text><line x1="28" y1="726" x2="1252" y2="726" stroke="#e6e8eb" stroke-width="1"/><rect x="29" y="732" width="1222" height="36" rx="0" fill="#f4f7fa"/><line x1="29" y1="768" x2="1251" y2="768" stroke="#e6e8eb" stroke-width="1"/><text x="41" y="754.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="0.8">CONSUMER</text><text x="281" y="754.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="0.8">READS</text><text x="701" y="754.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="