4" stroke="#f0f2f4" stroke-width="1"/><text x="41" y="867.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="600" text-anchor="start">Self-service</text><text x="281" y="867.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="start">only relationships the user may see</text><text x="701" y="867.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222222" font-weight="400" text-anchor="start">reveal other adults' data</text><rect x="1101" y="853.0" width="43" height="20" rx="10" fill="#e6f2f9"/><text x="1122.5" y="867.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#005b99" font-weight="600" text-anchor="middle">core</text><line x1="29" y1="882" x2="1251" y2="882" stroke="#f0f2f4" stroke-width="1"/></svg>