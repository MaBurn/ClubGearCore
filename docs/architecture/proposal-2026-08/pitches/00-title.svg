<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0077BA"/><rect x="0" y="0" width="1600" height="900" rx="0" fill="#005b99" opacity="0.25"/><text x="96" y="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="64" fill="#ffffff" font-weight="700" text-anchor="start">ClubGear</text><text x="96" y="356" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" fill="#cfe6f4" font-weight="300" text-anchor="start">Feature pitches</text><rect x="96" y="396" width="120" height="4" rx="2" fill="#EF7D00"/><text x="96" y="448" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#dcecf6" font-weight="400" text-anchor="start">One slide per feature, so priorities can be set on comparable information.</text><text x="96" y="478" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#dcecf6" font-weight="400" text-anchor="start">11 full pitches for the specified features, 15 compact cards for the rest of the backlog,</text><text x="96" y="508" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#dcecf6" font-weight="400" text-anchor="start">and a priority matrix at the end.</text><text x="96" y="600" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#a9d2e9" font-weight="400" text-anchor="start">Scores are my assessment, not measurements.</text><text x="96" y="626" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#a9d2e9" font-weight="400" text-anchor="start">They exist to be disagreed with — that is faster than a blank page.</text><text x="96" y="800" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8fc3e0" font-weight="400" text-anchor="start">30 August 2026 · nothing implemented · for prioritisation</text></svg>