th="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1390.0" y="666" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1416.0" y="666" width="22.0" height="12" rx="3" fill="#EF7D00"/><text x="1450.0" y="678" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">5/5</text><text x="1180" y="710" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="698" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="698" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1364.0" y="698" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1390.0" y="698" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="698" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="710" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">3/5</text><rect x="56" y="740" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="760" width="62" height="20" rx="10" fill="#efe6f7"/><text x="111.0" y="774" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">EDIT-01</text><text x="80" y="802" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">Editorial and publication planning</text><text x="80" y="824" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Plugin · XL</text><text x="560" y="780" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Submissions, issues, approvals for club magazine and newsletter. Only if the</text><text x="560" y="802" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">club actually publishes.</text><text x="1180" y="784" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="772" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="772" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="772" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1390.0" y="772" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1416.0" y="772" width="22.0" height="12" rx="3" fill="#EF7D00"/><text x="1450.0" y="784" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">5/5</text><text x="1180" y="816" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="804" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="804" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1364.0" y="804" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="804" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="804" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="816" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text></svg>