<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">REST OF THE BACKLOG  ·  1 OF 3</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">Compact cards</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Not specified in tmp/ — one line each, enough to rank them against the full pitches.</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="56" y="210" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="230" width="50" height="20" rx="10" fill="#efe6f7"/><text x="105.0" y="244" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">NC-01</text><text x="80" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">Nextcloud plugin — file backend + calendar store</text><text x="80" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Plugin · M–L</text><text x="560" y="250" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Makes the local/Nextcloud choice real. Only worth building once CORE-02 and</text><text x="560" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">CORE-07 expose their ports.</text><text x="1180" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="242" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="242" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="242" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1390.0" y="242" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1416.0" y="242" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">4/5</text><text x="1180" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="274" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1364.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">1/5</text><rect x="56" y="316" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="336" width="62" height="20" rx="10" fill="#e6f2f9"/><text x="111.0" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#005b99" font-weight="600" text-anchor="middle">CORE-09</text><text x="80" y="378" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">API keys and service accounts</text><text x="80" y="400" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Core · M</text><text x="560" y="356" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Every external client and the mobile inventory app needs this. Currently</text><text x="560" y="378" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">nothing can authenticate but a browser session.</text><text x="1180" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="348" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="348" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="348" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1390.0" y="348" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="348" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">3/5</text><text x="1180" y="392" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="380" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="380" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1364.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="392" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text><rect x="56" y="422" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="442" width="62" height="20" rx="10" fill="#e6f2f9"/><text x="111.0" y="456" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#005b99" font-weight="600" text-anchor="middle">CORE-12</text><text x="80" y="484" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">Audit, log and changelog views</text><text x="80" y="506" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Core · S–M</text><text x="560" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">The services exist; this is the admin UI on top. Cheapest item on the list.</text><text x="1180" y="466" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="454" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="454" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="454" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="454" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="454" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="466" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text><text x="1180" y="498" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="486" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="486" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1364.0" y="486" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="486" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="486" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="498" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">1/5</text><rect x="56" y="528" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="548" width="82" height="20" rx="10" fill="#e6f2f9"/><text x="121.0" y="562" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#005b99" font-weight="600" text-anchor="middle">CORE-10/11</text><text x="80" y="590" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">Branding, navigation, translations</text><text x="80" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Core · S–M / M</text><text x="560" y="568" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Cosmetic until the club wants its own look, then suddenly urgent.</text><text x="560" y="590" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Translations only matter with non-German members.</text><text x="1180" y="572" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="560" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="560" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="560" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="560" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="560" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="572" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text><text x="1180" y="604" font-family="Segoe UI, Arial, Helvetica, sans-serif" 