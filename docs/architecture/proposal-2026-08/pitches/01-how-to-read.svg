<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">HOW TO READ THIS</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">Four numbers per feature</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Same scale everywhere, so the slides can be compared rather than admired.</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="56" y="240" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="240" width="5" height="96" rx="2" fill="#0077BA"/><text x="84" y="278" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#16354f" font-weight="700" text-anchor="start">Value to the club</text><text x="400" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">How much a member, board member or treasurer actually notices it. 5 = someone's weekly work</text><text x="400" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">changes.</text><rect x="56" y="352" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="352" width="5" height="96" rx="2" fill="#0077BA"/><text x="84" y="390" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#16354f" font-weight="700" text-anchor="start">Blocks other work</text><text x="400" y="384" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">How much else is stuck behind it. 5 = several XL items cannot start. This is the number that</text><text x="400" y="406" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">usually decides sequence, not value.</text><rect x="56" y="464" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="464" width="5" height="96" rx="2" fill="#EF7D00"/><text x="84" y="502" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#16354f" font-weight="700" text-anchor="start">Effort</text><text x="400" y="496" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">1 = XS (1–2 PT) · 2 = M (6–12) · 3 = L (13–25) · 4 = L+ · 5 = XL (26–50+). Implementation and</text><text x="400" y="518" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">tests, no historical data migration.</text><rect x="56" y="576" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="576" width="5" height="96" rx="2" fill="#9b2c2c"/><text x="84" y="614" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#16354f" font-weight="700" text-anchor="start">Risk</text><text x="400" y="608" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Chance of building the wrong thing, or of it failing visibly in production. Money, personal data</text><text x="400" y="630" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">and concurrency push this up.</text><text x="56" y="724" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#0077BA" font-weight="700" text-anchor="start">A practical shortcut</text><text x="56" y="754" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222222" font-weight="400" text-anchor="start">If two features have the same value, build the one that blocks more. If two block equally, build the cheaper one first.</text><text x="56" y="782" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Everything in the Phase-1 column of the capability map scores high on »blocks other work« and low on »value« — that is normal for platform work,</text><text x="56" y="806" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">and the reason it tends to get postponed until it hurts.</text></svg>