<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">REST OF THE BACKLOG  ·  2 OF 3</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">Compact cards</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Not specified in tmp/ — one line each, enough to rank them against the full pitches.</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="56" y="210" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="230" width="56" height="20" rx="10" fill="#efe6f7"/><text x="108.0" y="244" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">DOC-01</text><text x="80" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">Document compendium</text><text x="80" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Plugin · M</text><text x="560" y="250" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Protected document store with metadata and search. Cheap once CORE-02</text><text x="560" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">exists.</text><text x="1180" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="242" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="242" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="242" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="242" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="242" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text><text x="1180" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="274" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="274" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1364.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="274" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text><rect x="56" y="316" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="336" width="75" height="20" rx="10" fill="#efe6f7"/><text x="117.5" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">NC-DOC-01</text><text x="80" y="378" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">Nextcloud document connector</text><text x="80" y="400" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Plugin · M</text><text x="560" y="356" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Largely absorbed by NC-01 if the file backend lands first — check before</text><text x="560" y="378" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">planning it separately.</text><text x="1180" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Effort</text><rect x="1312.0" y="348" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1338.0" y="348" width="22.0" height="12" rx="3" fill="#EF7D00"/><rect x="1364.0" y="348" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="348" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="348" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">2/5</text><text x="1180" y="392" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor="start">Risk</text><rect x="1312.0" y="380" width="22.0" height="12" rx="3" fill="#9b2c2c"/><rect x="1338.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1364.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1390.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><rect x="1416.0" y="380" width="22.0" height="12" rx="3" fill="#e3e8ec"/><text x="1450.0" y="392" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#16354f" font-weight="700" text-anchor="start">1/5</text><rect x="56" y="422" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="442" width="62" height="20" rx="10" fill="#efe6f7"/><text x="111.0" y