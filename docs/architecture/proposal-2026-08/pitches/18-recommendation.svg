<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">IF YOU WANT MY OPINION</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">One recommended cut</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Not a plan — a starting position to disagree with.</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="56" y="230" width="1488" height="140" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="230" width="5" height="140" rx="2" fill="#187344"/><text x="84" y="266" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#187344" font-weight="700" text-anchor="start">Build first</text><text x="84" y="296" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-02  file storage incl. the backend port</text><text x="84" y="318" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-03  contract increment, demand-driven</text><text x="84" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-01  organisation units</text><text x="1020" y="270" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">Roughly 33–50 PT. After this, a plugin can render a real page</text><text x="1020" y="292" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">and store a file, and everything has a scope.</text><rect x="56" y="382" width="1488" height="140" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="382" width="5" height="140" rx="2" fill="#0077BA"/><text x="84" y="418" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#0077BA" font-weight="700" text-anchor="start">Build second</text><text x="84" y="448" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-05  templates</text><text x="84" y="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-04  inbox + provider contract</text><text x="84" y="492" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-08  household relationships</text><text x="1020" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">Roughly 32–50 PT. This is where members start noticing the</text><text x="1020" y="444" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">system rather than the developer.</text><rect x="56" y="534" width="1488" height="140" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="534" width="5" height="140" rx="2" fill="#EF7D00"/><text x="84" y="570" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#EF7D00" font-weight="700" text-anchor="start">Then pick ONE domain</text><text x="84" y="600" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· FIN-01  if the treasurer is the bottleneck</text><text x="84" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· INV-01  if the workshop is the bottleneck</text><text x="1020" y="574" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">Both are XL. Doing one properly beats starting both. FIN-01</text><text x="1020" y="596" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">has higher risk, INV-01 has more volume.</text><rect x="56" y="686" width="1488" height="140" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="56" y="686" width="5" height="140" rx="2" fill="#9b2c2c"/><text x="84" y="722" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#9b2c2c" font-weight="700" text-anchor="start">Defer or drop</text><text x="84" y="752" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-06  unless RENT-01 is genuinely coming</text><text x="84" y="774" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· NEWS-01, RENT-01, EDIT-01, and the whole P3 set</text><text x="84" y="796" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">· CORE-11 translations unless there are non-German members</text><text x="1020" y="726" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">The backlog is 400+ PT. Deferring is not failure; pretending</text><text x="1020" y="748" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">otherwise is.</text><text x="56" y="856" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#0077BA" font-weight="600" text-anchor="start">The one question that changes all of this: which domains must exist before Clubmanager can be switched off?</text></svg>