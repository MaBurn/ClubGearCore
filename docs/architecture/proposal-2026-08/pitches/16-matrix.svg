<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">PRIORITISATION</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">Value against effort</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Bubble size = how much other work is blocked. Colour = core (blue) or plugin (purple).</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="200" y="250" width="900" height="520" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><line x1="380.0" y1="250" x2="380.0" y2="770" stroke="#f0f2f4" stroke-width="1"/><line x1="200" y1="354.0" x2="1100" y2="354.0" stroke="#f0f2f4" stroke-width="1"/><line x1="560.0" y1="250" x2="560.0" y2="770" stroke="#f0f2f4" stroke-width="1"/><line x1="200" y1="458.0" x2="1100" y2="458.0" stroke="#f0f2f4" stroke-width="1"/><line x1="740.0" y1="250" x2="740.0" y2="770" stroke="#f0f2f4" stroke-width="1"/><line x1="200" y1="562.0" x2="1100" y2="562.0" stroke="#f0f2f4" stroke-width="1"/><line x1="920.0" y1="250" x2="920.0" y2="770" stroke="#f0f2f4" stroke-width="1"/><line x1="200" y1="666.0" x2="1100" y2="666.0" stroke="#f0f2f4" stroke-width="1"/><text x="650.0" y="810" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5f6368" font-weight="700" text-anchor="middle">Effort  →</text><text x="154" y="236" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5f6368" font-weight="700" text-anchor="start">Value ↑</text><text x="290.0" y="790" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">XS</text><text x="470.0" y="790" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">M</text><text x="650.0" y="790" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">L</text><text x="830.0" y="790" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">L+</text><text x="1010.0" y="790" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">XL</text><text x="186" y="722.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">1</text><text x="186" y="618.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">2</text><text x="186" y="514.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">3</text><text x="186" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">4</text><text x="186" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">5</text><circle cx="650.0" cy="302.0" r="41" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="650.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-03</text><circle cx="470.0" cy="302.0" r="36" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="470.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-02</text><circle cx="588.0" cy="393.0" r="36" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="588.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-01</text><circle cx="650.0" cy="419.0" r="31" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="650.0" y="423.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-05</text><circle cx="712.0" cy="393.0" r="31" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="712.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-04</text><circle cx="470.0" cy="510.0" r="26" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="470.0" y="514.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-08</text><circle cx="830.0" cy="406.0" r="26" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="830.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-07</text><circle cx="650.0" cy="614.0" r="26" fill="rgba(0,119,186,0.20)" stroke="#0077BA" stroke-width="1.6"/><text x="650.0" y="618.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#0077BA" font-weight="700" text-anchor="middle">CORE-06</text><circle cx="979.0" cy="302.0" r="21" fill="rgba(91,61,134,0.18)" stroke="#5b3d86" stroke-width="1.6"/><text x="979.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5b3d86" font-weight="700" text-anchor="middle">INV-01</text><circle cx="1041.0" cy="302.0" r="21" fill="rgba(91,61,134,0.18)" stroke="#5b3d86" stroke-width="1.6"/><text x="1041.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5b3d86" font-weight="700" text-anchor="middle">FIN-01</text><circle cx="1010.0" cy="510.0" r="21" fill="rgba(91,61,134,0.18)" stroke="#5b3d86" stroke-width="1.6"/><text x="1010.0" y="547.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5b3d86" font-weight="700" text-anchor="middle">NEWS-01</text><rect x="1140" y="250" width="404" height="268" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><text x="1164" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#0077BA" font-weight="700" text-anchor="start">How to read the quadrants</text><text x="1164" y="318" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#16354f" font-weight="700" text-anchor="start">Top-left</text><text x="1164" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">cheap and valuable — do them</text><text x="1164" y="370" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#16354f" font-weight="700" text-anchor="start">Top-right</text><text x="1164" y="388" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">valuable and expensive — sequence them, do</text><text x="1164" y="404" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">not skip</text><text x="1164" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#16354f" font-weight="700" text-anchor="start">Bottom-left</text><text x="1164" y="440" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">cheap platform work — worth it for what it</text><text x="1164" y="456" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">unblocks</text><text x="1164" y="474" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#16354f" font-weight="700" text-anchor="start">Bottom-right</text><text x="1164" y="492" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">expensive and conditional — CORE-06 lives</text><text x="1164" y="508" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">here</text><rect x="1140" y="540" width="404" height="232" rx="10" fill="#fffaf2" stroke="#f0d5ab" stroke-width="1" stroke-dasharray="4 3"/><text x="1164" y="576" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a5a00" font-weight="700" text-anchor="start">What the picture says</text><text x="1164" y="606" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">CORE-02 is the only item that is cheap, valuable</text><text x="1164" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">and blocking. It should be first or second.</text><text x="1164" y="638" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start"></text><text x="1164" y="654" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">CORE-03 scores low on direct value and highest on</text><text x="1164" y="670" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">blocking — the classic item that gets postponed</text><text x="1164" y="686" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">until five plugins have worked around it.</text><text x="1164" y="702" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start"></text><text x="1164" y="718" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">INV-01 and FIN-01 carry the visible value, and</text><text x="1164" y="734" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">both sit behind the platform column.</text><text x="1164" y="750" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start"></text><text x="1164" y="766" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">CORE-06 is the one I would cut first.</text></svg>