<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">REST OF THE BACKLOG  ·  3 OF 3</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">Compact cards</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Not specified in tmp/ — one line each, enough to rank them against the full pitches.</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="56" y="210" width="1488" height="96" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1"/><rect x="80" y="230" width="56" height="20" rx="10" fill="#efe6f7"/><text x="108.0" y="244" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b3d86" font-weight="600" text-anchor="middle">GPS-01</text><text x="80" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#16354f" font-weight="700" text-anchor="start">GPS trackers and Traccar</text><text x="80" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start">Plugin · L</text><text x="560" y="250" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#222222" font-weight="400" text-anchor="start">Very club-specific. Only if vehicles are actually tracked.</text><text x="1180" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368" font-weight="600" text-anchor