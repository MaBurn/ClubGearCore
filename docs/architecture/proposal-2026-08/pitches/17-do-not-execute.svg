<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#0077BA"/><text x="56" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" letter-spacing="1.2">CONSTRAINTS, NOT PRIORITIES</text><text x="56" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#0077BA" font-weight="700" text-anchor="start">Do not execute</text><text x="56" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">These are not on the priority list because they are not choices. Full detail on diagram page 11.</text><line x1="56" y1="168" x2="1544" y2="168" stroke="#dde3e8" stroke-width="1"/><rect x="56" y="214" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="242" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-01</text><text x="148" y="242" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No provider-specific code in the core</text><text x="76" y="266" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">Matrix, Telegram, SMS, E-Post, Nextcloud, Listmonk, Traccar — all plugins behind generic contracts.</text><rect x="56" y="290" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="318" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-02</text><text x="148" y="318" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No core branch on a module id</text><text x="76" y="342" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">No plugin-specific DTO in the contract, no switch on a plugin name in the host.</text><rect x="56" y="366" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="394" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-03</text><text x="148" y="394" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No cross-schema access in either direction</text><text x="76" y="418" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">Read models and contract facades only — both ways.</text><rect x="56" y="442" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-04</text><text x="148" y="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No silent fallback</text><text x="76" y="494" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">Channels and storage backends report the declared policy instead of substituting quietly.</text><rect x="56" y="518" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="546" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-05</text><text x="148" y="546" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No second plugin architecture</text><text x="76" y="570" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">No out-of-process/gRPC host, no free Razor assemblies outside contract control.</text><rect x="56" y="594" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-06</text><text x="148" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No parallel template systems</text><text x="76" y="646" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">Exactly one versioned system; the simple renderer is replaced, not kept beside it.</text><rect x="56" y="670" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="698" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-07</text><text x="148" y="698" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No paths and no secrets in ordinary configuration</text><text x="76" y="722" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">No filesystem access from controllers, no credential in a plain config value.</text><rect x="56" y="746" width="900" height="68" rx="8" fill="#fbe9e9" stroke="#e3b6b6" stroke-width="1"/><text x="76" y="774" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b2c2c" font-weight="700" text-anchor="start">DNX-08</text><text x="148" y="774" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9b2c2c" font-weight="700" text-anchor="start">No hard-coded state machine beside the workflow engine</text><text x="76" y="798" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222" font-weight="400" text-anchor="start">Cutting CORE-06 is allowed; hard-coding states because it was cut is not.</text><text x="996" y="214" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#16354f" font-weight="700" text-anchor="start">Do not port, even though it works</text><text x="996" y="252" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9b2c2c" font-weight="700" text-anchor="start">✕</text><text x="1018" y="252" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">Thousand-line controllers as a porting unit — 277 KB /</text><text x="1018" y="270" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">128 KB / 73 KB in Clubmanager</text><text x="996" y="304" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9b2c2c" font-weight="700" text-anchor="start">✕</text><text x="1018" y="304" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">ReferateController as hard-coded view names — use</text><text x="1018" y="322" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">CORE-01 plus plugin navigation</text><text x="996" y="356" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9b2c2c" font-weight="700" text-anchor="start">✕</text><text x="1018" y="356" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">Keycloak group management as the local authority — local</text><text x="1018" y="374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">roles stay authoritative</text><text x="996" y="408" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9b2c2c" font-weight="700" text-anchor="start">✕</text><text x="1018" y="408" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">Debug controllers as productive routes —</text><text x="1018" y="426" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">development-only diagnostics</text><text x="996" y="460" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9b2c2c" font-weight="700" text-anchor="start">✕</text><text x="1018" y="460" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">ToolRental as a second plugin — lending in INV-01,</text><text x="1018" y="478" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#222222" font-weight="400" text-anchor="start">commercial rental in RENT-01</text><rect x="996" y="500" width="548" height="176" rx="10" fill="#fffaf2" stroke="#f0d5ab" stroke-width="1" stroke-dasharray="4 3"/><text x="1018" y="534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a5a00" font-weight="700" text-anchor="start">Breaking one is allowed — silently is not</text><text x="1018" y="562" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">There will be a day when the pragmatic choice violates one of</text><text x="1018" y="581" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">these. The rule is not »never«; it is: write down which item you</text><text x="1018" y="600" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">are breaking, why, and what would undo it.</text><text x="1018" y="619" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start"></text><text x="1018" y="638" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">That is the whole difference between a deliberate exception and</text><text x="1018" y="657" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a5310" font-weight="400" text-anchor="start">the state Clubmanager reached over several years.</text><text x="56" y="856" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">Per-feature »out of scope« is listed verbatim on diagram page 11 — eleven features, three exclusions each, straight from the specifications.</text></svg>